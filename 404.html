<style>
body{margin:0;background:#F5F0E8}
*{box-sizing:border-box}
a{color:#1A1815}a:hover{color:#9E1B22}
h1,h2,h3{text-wrap:balance}

.wrap{max-width:1200px;margin:0 auto;padding:0 32px}

.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,0.95fr);gap:64px;align-items:center}

.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.ev{display:grid;grid-template-columns:160px minmax(0,1fr) auto;gap:32px;align-items:center}
.h1{font-size:60px;line-height:1}
.h2{font-size:36px;line-height:40px}

.ghost:hover{transform:translateY(-2px);opacity:0.8}

.card{transition:transform 500ms cubic-bezier(0.22,1,0.36,1)}

.navlink{text-decoration:none;transition:opacity 300ms cubic-bezier(0.22,1,0.36,1)}

.skip:focus{transform:translateY(80px);color:#F5F0E8}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}

details[open] .plus{transform:rotate(45deg)}

@media (prefers-reduced-motion: reduce){
  @keyframes menuIn{from{opacity:0}to{opacity:1}}

}
@media (max-width:960px){
  .hero,.split{grid-template-columns:minmax(0,1fr);gap:48px}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .only-desktop{display:none !important}
  .only-mobile{display:inline-flex}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .sec{padding:64px 0}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}

.w{display:inline-block;margin:0 0.12em;opacity:0.3;transition:opacity 500ms cubic-bezier(0.22,1,0.36,1)}

.js .reveal.in{opacity:1;transform:none}
